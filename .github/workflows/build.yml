name: build

on:
  workflow_dispatch:
    inputs:
      bundles:
        description: Bundle names from bundles.json, comma-separated (blank = all)
        default: ''
      release:
        description: Publish the builds as a GitHub release
        type: boolean
        default: false

env:
  MAME_TAG: mame0244
  EMSDK_VERSION: 3.1.8   # contemporary with MAME 0.244 (April 2022)

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 scripts/matrix.py "${{ inputs.bundles }}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out MAME ${{ env.MAME_TAG }}
        uses: actions/checkout@v4
        with:
          repository: mamedev/mame
          ref: ${{ env.MAME_TAG }}
          path: mame
          fetch-depth: 1

      - name: Apply the browser patches
        working-directory: mame
        run: for p in ../patches/*.patch; do echo "$p"; git apply --verbose "$p"; done

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build ${{ matrix.name }}
        working-directory: mame
        run: |
          # tms57002.h includes a generated file, but 0.244's build only declares that for the
          # CPU's own sources, so a driver including the header (konamigx.cpp) can be compiled
          # first. Generated up front with MAME's own script, as its build would. The header
          # reaches it as "../../emu/cpu/..." through the generated/emu/layout include folder,
          # which only exists once some layout has been built, so that folder is made too.
          mkdir -p build/generated/emu/cpu/tms57002 build/generated/emu/layout
          python3 src/devices/cpu/tms57002/tmsmake.py s src/devices/cpu/tms57002/tmsinstr.lst build/generated/emu/cpu/tms57002/tms57002.hxx
          emmake make SUBTARGET=${{ matrix.name }} SOURCES=${{ matrix.sources }} \
            WEBASSEMBLY=1 OPTIMIZE=3 NOWERROR=1 IGNORE_GIT=1 LDOPTS=-lidbfs.js -j"$(nproc)" 2>&1 | tee ../build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Collect output
        run: |
          mkdir -p out
          # MAME names the output after SUBTARGET (pacman.js loads pacman.wasm by that name).
          cp mame/${{ matrix.name }}.js mame/${{ matrix.name }}.wasm out/
          echo "${{ matrix.sources }}" > out/${{ matrix.name }}.sources.txt
          grep -i "undefined symbol" build.log | sort -u > out/${{ matrix.name }}.undefined.txt || true
          # Undefined symbols only fail when a game calls them, so any but the two OpenGL calls
          # MAME's docs expect mean a source file is missing from the bundle (add it to bundles.json).
          if grep -v -e glPopAttrib -e glPushAttrib out/${{ matrix.name }}.undefined.txt; then exit 1; fi
          ls -l out
          gzip -9 -c out/${{ matrix.name }}.wasm | wc -c | xargs echo "wasm gzip bytes:"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: out/

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.name }}
          path: build.log

  release:
    if: ${{ inputs.release }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # For MAME's license notice and texts, which go out with the builds.
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            COPYING
            docs/legal
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true
      - name: Add the license
        run: |
          cp repo/COPYING dist/COPYING
          for f in repo/docs/legal/*; do cp "$f" "dist/legal-$(basename "$f").txt"; done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${MAME_TAG}-build${{ github.run_number }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "MAME 0.244 WebAssembly, build ${{ github.run_number }}" \
            --notes "Built from mamedev/mame tag ${MAME_TAG} (source: https://github.com/mamedev/mame/tree/${MAME_TAG}) with the patches in ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}, using Emscripten ${EMSDK_VERSION}. MAME is licensed under the GNU GPL v2 (COPYING and legal-*.txt). No ROMs included."
